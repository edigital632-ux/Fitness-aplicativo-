<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPlan - Seu Personal Trainer com IA</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: 'Inter', sans-serif;
        }
        .card-bg {
            background-color: #141416;
            border: 1px solid #27272a;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen p-4 sm:p-6 selection:bg-emerald-500 selection:text-black">

    <div class="w-full max-w-md flex flex-col gap-5">
        
        <header class="flex items-center justify-between py-2">
            <div class="flex items-center gap-2 text-xl font-bold tracking-tight">
                <div class="bg-emerald-500 text-black p-1.5 rounded-xl flex items-center justify-center">
                    <i data-lucide="zap" class="w-5 h-5 fill-current"></i>
                </div>
                <span>Fit<span class="text-emerald-500">Plan</span></span>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-zinc-800/80 px-3 py-1 rounded-full flex items-center gap-1.5 text-sm border border-zinc-700">
                    <span class="text-orange-500">🔥</span>
                    <span class="font-bold text-zinc-300">0</span>
                </div>
                <div class="bg-emerald-950/50 text-emerald-400 border border-emerald-800/60 px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    IA Ativa
                </div>
            </div>
        </header>

        <div class="card-bg rounded-3xl p-6 relative overflow-hidden group">
            <div class="absolute right-4 bottom-2 opacity-10 text-emerald-500 group-hover:scale-110 transition-transform duration-300">
                <i data-lucide="dumbbell" class="w-28 h-28"></i>
            </div>
            <h1 class="text-2xl font-black text-zinc-100 mb-1">Seu Personal Trainer com IA</h1>
            <p class="text-zinc-400 text-sm leading-relaxed max-w-[85%]">
                Plano personalizado com nutrição, treino e análise de progresso.
            </p>
        </div>

        <main class="card-bg rounded-3xl p-6 flex flex-col gap-6">
            
            <div class="flex flex-col gap-4">
                <div class="flex items-center gap-2 text-zinc-400 text-xs font-bold tracking-widest uppercase">
                    <i data-lucide="user" class="w-4 h-4 text-emerald-500"></i>
                    Seus Dados
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-semibold text-zinc-400">Como quer ser chamado?</label>
                    <input type="text" id="nome" value="Jeferson" class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl px-4 py-3.5 text-zinc-200 font-medium focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-semibold text-zinc-400">Idade</label>
                        <input type="number" id="idade" value="25" class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl px-3 py-3.5 text-center text-zinc-200 font-medium focus:outline-none focus:border-emerald-500 transition-all">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-semibold text-zinc-400">Peso (kg)</label>
                        <input type="number" id="peso" value="75" class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl px-3 py-3.5 text-center text-zinc-200 font-medium focus:outline-none focus:border-emerald-500 transition-all">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-semibold text-zinc-400">Altura (cm)</label>
                        <input type="number" id="altura" value="175" class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl px-3 py-3.5 text-center text-zinc-200 font-medium focus:outline-none focus:border-emerald-500 transition-all">
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-3">
                <div class="flex items-center gap-2 text-zinc-400 text-xs font-bold tracking-widest uppercase">
                    <i data-lucide="target" class="w-4 h-4 text-emerald-500"></i>
                    Objetivo
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="selecionarObjetivo('hipertrofia', this)" class="btn-objetivo flex items-center justify-center gap-1 py-3 px-2 rounded-xl border font-semibold text-xs transition-all bg-emerald-950/40 border-emerald-500/80 text-emerald-400 shadow-[0_0_12px_rgba(16,185,129,0.1)]">
                        💪 Hipertrofia
                    </button>
                    <button type="button" onclick="selecionarObjetivo('secar', this)" class="btn-objetivo flex items-center justify-center gap-1 py-3 px-2 rounded-xl border border-zinc-800 bg-zinc-900/40 text-zinc-400 font-semibold text-xs hover:border-zinc-700 transition-all">
                        🔥 Secar
                    </button>
                    <button type="button" onclick="selecionarObjetivo('saude', this)" class="btn-objetivo flex items-center justify-center gap-1 py-3 px-2 rounded-xl border border-zinc-800 bg-zinc-900/40 text-zinc-400 font-semibold text-xs hover:border-zinc-700 transition-all">
                        ❤️ Saúde
                    </button>
                </div>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-zinc-400 flex items-center gap-1.5">
                    Contexto extra (opcional)
                </label>
                <textarea id="contexto" placeholder="Tenho dor no joelho, treino 4x semana..." rows="3" class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl p-4 text-zinc-200 text-sm focus:outline-none focus:border-emerald-500 transition-all resize-none"></textarea>
            </div>

            <button id="btnCriarPlano" onclick="enviarDados()" class="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-black font-black py-4 rounded-2xl flex items-center justify-center gap-2 transition-all cursor-pointer shadow-[0_4px_20px_rgba(16,185,129,0.25)]">
                <i data-lucide="zap" class="w-5 h-5 fill-current"></i>
                Criar Plano com IA
            </button>

        </main>

        <div id="toast" class="hidden transform translate-y-4 opacity-0 transition-all duration-300 w-full card-bg border-red-900/50 p-4 rounded-2xl flex items-start gap-3 shadow-xl">
            <div class="bg-red-950/80 text-red-400 p-2 rounded-xl flex items-center justify-center border border-red-900/50" id="toastIconContainer">
                <i data-lucide="circle-x" id="toastIcon" class="w-5 h-5"></i>
            </div>
            <div class="flex-1 flex flex-col gap-0.5">
                <span class="text-sm font-bold text-zinc-200" id="toastTitle">Erro de Conexão</span>
                <span class="text-xs text-zinc-400 leading-normal" id="toastMessage">Incapaz de buscar os dados do servidor.</span>
            </div>
        </div>

    </div>

    <script>
        // Inicializa os ícones do Lucide
        lucide.createIcons();

        let objetivoSelecionado = 'hipertrofia';

        // Função simples para alternar os botões de objetivo
        function selecionarObjetivo(objetivo, elemento) {
            objetivoSelecionado = objetivo;
            
            // Reseta todos os botões
            document.querySelectorAll('.btn-objetivo').forEach(btn => {
                btn.className = "btn-objetivo flex items-center justify-center gap-1 py-3 px-2 rounded-xl border border-zinc-800 bg-zinc-900/40 text-zinc-400 font-semibold text-xs hover:border-zinc-700 transition-all";
            });

            // Ativa o selecionado
            elemento.className = "btn-objetivo flex items-center justify-center gap-1 py-3 px-2 rounded-xl border font-semibold text-xs transition-all bg-emerald-950/40 border-emerald-500/80 text-emerald-400 shadow-[0_0_12px_rgba(16,185,129,0.1)]";
        }

        // Função que trata a requisição corrigindo os bugs de JSON e CORS
        async function enviarDados() {
            const btn = document.getElementById('btnCriarPlano');
            const toast = document.getElementById('toast');
            
            // Captura os dados da tela
            const payload = {
                nome: document.getElementById('nome').value,
                idade: parseInt(document.getElementById('idade').value),
                peso: parseFloat(document.getElementById('peso').value),
                altura: parseInt(document.getElementById('altura').value),
                objetivo: objetivoSelecionado,
                contexto: document.getElementById('contexto').value
            };

            // Efeito de Carregando no Botão
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Gerando Plano...`;
            esconderToast();

            // ⚠️ ATENÇÃO: Substitua pelo link correto da sua API na Vercel ou Supabase Edge Function
            const URL_DA_API = 'https://SUA_API_AQUI.vercel.app/api/gerar-plano'; 

            try {
                const response = await fetch(URL_DA_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                // 🔥 CORREÇÃO PRINCIPAL: Se o servidor responder com erro (Ex: 404, 500 ou erro de CORS)
                if (!response.ok) {
                    // Evita rodar o .json() e captura o erro como texto para análise
                    const textoErro = await response.text();
                    
                    // Se a mensagem começar com algo relacionado ao proxy/CORS, traduz para o usuário
                    if (textoErro.includes("corsd") || textoErro.toLowerCase().includes("cors")) {
                        throw new Error("Bloqueio de CORS: O backend precisa permitir requisições vindas do GitHub Pages.");
                    }
                    
                    throw new Error(`Erro do Servidor (${response.status}): ${textoErro.substring(0, 50)}...`);
                }

                // Se chegou aqui, a resposta é um JSON válido
                const data = await response.json();
                
                // Sucesso! Trate os dados recebidos aqui (ex: redirecionar ou mostrar na tela)
                exibirToast("Plano Gerado!", "Seu plano foi criado com sucesso pela IA.", "success");
                console.log("Sucesso:", data);

            } catch (error) {
                console.error("Erro capturado:", error);
                
                // Trata especificamente o 'Failed to fetch' (queda de rede ou CORS extremo)
                if (error.message === "Failed to fetch") {
                    exibirToast("Unexpected token 'S'", "O servidor retornou um texto com erro CORS em vez de JSON. Verifique as configurações de origem no backend.", "error");
                } else {
                    exibirToast("Erro na Requisição", error.message, "error");
                }
            } finally {
                // Restaura o botão
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="zap" class="w-5 h-5 fill-current"></i> Criar Plano com IA`;
                lucide.createIcons(); // Atualiza os ícones do botão
            }
        }

        function exibirToast(titulo, mensagem, tipo) {
            const toast = document.getElementById('toast');
            const tTitle = document.getElementById('toastTitle');
            const tMessage = document.getElementById('toastMessage');
            const tIconCont = document.getElementById('toastIconContainer');
            const tIcon = document.getElementById('toastIcon');

            tTitle.innerText = titulo;
            tMessage.innerText = mensagem;

            if (tipo === "success") {
                toast.className = "w-full card-bg border-emerald-900/50 p-4 rounded-2xl flex items-start gap-3 shadow-xl transition-all duration-300";
                tIconCont.className = "bg-emerald-950/80 text-emerald-400 p-2 rounded-xl flex items-center justify-center border border-emerald-900/50";
                tIcon.setAttribute('data-lucide', 'circle-check');
            } else {
                toast.className = "w-full card-bg border-red-900/50 p-4 rounded-2xl flex items-start gap-3 shadow-xl transition-all duration-300";
                tIconCont.className = "bg-red-950/80 text-red-400 p-2 rounded-xl flex items-center justify-center border border-red-900/50";
                tIcon.setAttribute('data-lucide', 'circle-x');
            }

            lucide.createIcons();
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 50);
        }

        function esconderToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('translate-y-4', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
